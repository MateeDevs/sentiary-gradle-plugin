name: Staging plugin
on:
  push:
    branches: [staging]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.5'
      - name: Check out staging CLI
        uses: actions/checkout@v5
        with:
          repository: MateeDevs/sentiary-tools
          ref: 683fb4d2a66b042ada6cacb8e0775ead78f0e55d
          path: tools
      - name: Build integration CLI
        working-directory: tools
        run: go build -o "$RUNNER_TEMP/sentiary-cli" ./cmd/sentiary-cli
      - name: Check plugin and integration fixtures
        env:
          SENTIARY_TEST_CLI: ${{ runner.temp }}/sentiary-cli
        run: ./gradlew check assemble
      - uses: actions/upload-artifact@v4
        with:
          name: sentiary-gradle-plugin-staging
          path: |
            gradle-plugin/build/libs/
            gradle-plugin/build/reports/
          if-no-files-found: error
